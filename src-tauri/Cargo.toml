[package]
name = "fbtool"
version = "0.1.0"
description = "FB入金データ生成ツール"
authors = ["you"]
edition = "2021"

[lib]
name = "fbtool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
csv = "1"
thiserror = "1"
